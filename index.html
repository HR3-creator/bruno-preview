<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bruno Saquicela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;700&display=swap">
<style>
/* v2 realistic: photo skyline fades day > golden hour > night, photo signal box, textured pole, concrete sidewalk. */
:root{
  --led:#FF7A1F; --led-white:#F4EFE2; --enamel:#F2EFE6; --ink:#16181B; --muted:#55595F;
  --street:#1C6644; --tag:#EFE4C8;
  --f-sign:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  --f-led:"Doto","Overpass Mono",ui-monospace,monospace;
  --pole-w:34px; --sway:0deg; --pole-tex:none; --concrete-tex:none;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#8FB6DD;color:var(--ink)}
body{font-family:var(--f-sign);overflow-x:clip;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--led);outline-offset:4px}

/* Sky: three matched photos */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#0B1026}
.ph{position:absolute;left:0;right:0;top:0;height:116vh;background-size:cover;background-position:42% 100%;will-change:transform,opacity}
.ph.gold,.ph.night{opacity:0}
/* Fine film grain over the sky: reads as photographic and hides any leftover softness. */
.sky::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:soft-light;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

/* Scene */
.scene{position:relative;z-index:1;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pole{position:absolute;left:50%;width:var(--pole-w);margin-left:calc(var(--pole-w) / -2);top:calc(7vh + 10px);bottom:-80px;z-index:1;
  background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.12) 30%,rgba(255,255,255,.16) 47%,rgba(0,0,0,.1) 62%,rgba(0,0,0,.66)),var(--pole-tex) center top / 100% auto repeat-y,#3C4440;
  box-shadow:6px 0 14px rgba(0,0,0,.25)}
.pole::before{content:"";position:absolute;top:-12px;left:-5px;right:-5px;height:18px;border-radius:50% 50% 4px 4px;background:linear-gradient(90deg,#1b1f22,#4c545c 45%,#1b1f22)}

/* Hero */
.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding-top:7vh}
.signal{position:relative;width:min(342px,100%);container-type:inline-size}
.signal img{display:block;width:100%;height:auto;filter:drop-shadow(0 22px 26px rgba(6,10,25,.45))}
.ledbox{position:absolute;left:10.3%;width:80.5%;top:21%;height:65.6%;display:grid;place-content:center;justify-items:center;gap:2.1cqw;mix-blend-mode:screen}
.led{margin:0;font-family:var(--f-led);font-weight:900;font-size:21.3cqw;line-height:.95;letter-spacing:.06em;padding-left:.06em;color:var(--led);
  text-shadow:0 0 .12em rgba(255,122,31,.95),0 0 .45em rgba(255,90,10,.6);animation:power 1.1s steps(1) both}
.led-sub{margin:0;font-family:var(--f-led);font-weight:700;font-size:6.4cqw;letter-spacing:.34em;padding-left:.34em;color:var(--led-white);text-shadow:0 0 .3em rgba(255,250,235,.75)}
@keyframes power{0%{opacity:1}12%{opacity:.25}20%{opacity:1}34%{opacity:.5}42%,100%{opacity:1}}
.plaque{position:relative;width:min(360px,100%);margin-top:14px;padding:20px 22px;border-radius:6px;background:var(--enamel);
  box-shadow:inset 0 0 0 3px var(--enamel),inset 0 0 0 5px var(--ink),0 14px 28px rgba(6,10,25,.35)}
.plaque::before,.plaque::after{content:"";position:absolute;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9ccd0,#4d5257)}
.plaque::before{top:9px}.plaque::after{bottom:9px}
.eyebrow{margin:6px 0 0;font:700 11.5px/1.35 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
.bio{margin:10px 0 0;font:400 15.5px/1.58 var(--f-sign);text-wrap:pretty}
.cue{display:flex;align-items:center;gap:12px;margin-top:16px;font:800 13px/1.2 var(--f-sign);letter-spacing:.12em;text-transform:uppercase}
.cue svg{flex:none;width:28px;height:36px}

/* Rack */
.rack{position:relative;padding-block:72px 140px}
.blade-row{position:relative;z-index:3;display:flex;justify-content:center;padding-block:40px 64px}
.blade{min-width:min(280px,80%);padding:8px 26px 11px;border-radius:7px;text-align:center;background:var(--street);color:#fff;
  box-shadow:inset 0 0 0 3px var(--street),inset 0 0 0 5px #F4F4F0,0 10px 20px rgba(6,10,25,.35)}
.blade h2{margin:0;font:800 clamp(26px,5.4vw,36px)/1.05 var(--f-sign)}
.blade p{margin:3px 0 0;font:700 11px/1.3 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;opacity:.92}
.row{position:relative;display:grid;grid-template-columns:1fr 1fr}
.row + .row{margin-top:calc(-1 * clamp(40px,10vw,170px))}
.arm{position:absolute;top:0;height:10px;z-index:0;border-radius:5px;background:linear-gradient(180deg,#9aa2a9,#4a5157 45%,#1f2427)}
.row.right .arm{left:50%;width:25%}.row.left .arm{left:25%;width:25%}
.clamp{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 35%,#8b939c,#1b1f22)}
.row.right .clamp{left:75%}.row.left .clamp{left:25%}
.collar{position:absolute;top:-6px;left:50%;width:calc(var(--pole-w) + 10px);height:22px;transform:translateX(-50%);z-index:2;border-radius:4px;background:linear-gradient(90deg,#15191c,#59616a 45%,#15191c)}
.slot{position:relative;z-index:2;grid-row:1;display:flex;justify-content:center;padding-top:4px;min-width:0}
.row.right .slot{grid-column:2}.row.left .slot{grid-column:1}
.swing{transform-origin:50% 0;transform:rotate(calc(var(--sway) * var(--k,1)))}
.settle{transform-origin:50% 0}
.row.in .settle{animation:settle 1.9s cubic-bezier(.25,.7,.3,1) both}
@keyframes settle{0%{transform:rotate(5deg)}25%{transform:rotate(-3.5deg)}50%{transform:rotate(1.8deg)}75%{transform:rotate(-.8deg)}100%{transform:rotate(0)}}
.piece{position:relative;display:block;width:calc(clamp(128px,34vw,320px) * var(--scale,1));padding:0 0 40px;border:0;background:none;cursor:pointer;text-align:left}
.piece.hat{width:calc(clamp(124px,28vw,250px) * var(--scale,1))}
.wire{display:block;width:100%;height:46px;overflow:visible}
.frame{padding:clamp(6px,1.1vw,12px);background:var(--frame,#1b1b1b);box-shadow:0 18px 32px rgba(6,10,25,.45),inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .25s}
.frame canvas,.frame img,.hat-art canvas,.hat-art img{display:block;width:100%;height:auto;aspect-ratio:var(--ratio);object-fit:cover}
.hat-art{filter:drop-shadow(0 16px 18px rgba(6,10,25,.45));transition:transform .25s}
.piece:hover .frame,.piece:hover .hat-art,.piece:hover .cut{transform:translateY(-3px)}
.cut{position:relative;overflow:hidden;width:100%;filter:drop-shadow(0 18px 22px rgba(6,10,25,.5));transition:transform .25s}
.cut img{position:absolute;display:block;max-width:none;height:auto}
.tag{position:absolute;right:6%;bottom:0;transform:rotate(-6deg);transform-origin:100% 0;padding:6px 10px 6px 18px;background:var(--tag);color:var(--ink);
  font:700 11px/1.3 var(--f-mono);letter-spacing:.04em;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);box-shadow:0 3px 6px rgba(0,0,0,.25)}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:rgba(0,0,0,.35)}
.tag span{display:block;white-space:nowrap}
.tag .ph-label{font-weight:400;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Sidewalk */
.sidewalk{position:relative;z-index:3;overflow:hidden;min-height:clamp(320px,54vh,540px);display:flex;flex-direction:column;align-items:center;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:96px 48px;
  background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 70px),var(--concrete-tex) center top / cover no-repeat,#A7A49C}
.curb{position:absolute;top:0;left:0;right:0;height:20px;background:linear-gradient(180deg,#DAD6CC,#C4C0B6 60%,#8f8b82);box-shadow:0 6px 10px rgba(0,0,0,.22)}
.base{position:absolute;top:8px;left:50%;width:96px;height:24px;transform:translateX(-50%);border-radius:3px;
  background:radial-gradient(circle at 12px 12px,#1c2024 0 3px,transparent 3.5px),radial-gradient(circle at 84px 12px,#1c2024 0 3px,transparent 3.5px),linear-gradient(180deg,#7d858c,#3c4247)}
.stencil{position:relative;margin:24px 0 0;text-align:center;font:700 clamp(20px,5vw,38px)/1.1 var(--f-mono);letter-spacing:.26em;padding-left:.26em;
  text-transform:uppercase;color:rgba(20,20,22,.78);transform:rotate(-1.5deg);mix-blend-mode:multiply}
.stencil small{display:block;margin-top:10px;font-size:.46em;letter-spacing:.42em}
.up{display:inline-block;text-decoration:none;padding:12px 20px;border:0;border-radius:5px;cursor:pointer;background:var(--enamel);color:var(--ink);font:800 13px/1 var(--f-sign);letter-spacing:.12em;text-transform:uppercase;
  box-shadow:inset 0 0 0 2px var(--enamel),inset 0 0 0 4px var(--ink),0 6px 14px rgba(0,0,0,.25)}

.up.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.sidewalk .up + .up{margin-top:-8px}
.gal-sign{display:block;text-decoration:none;color:#fff}
/* Dialog */
dialog{width:min(820px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:0;border-radius:10px;background:var(--enamel);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(8,10,22,.64)}
.d-grid{display:grid;grid-template-columns:1.1fr 1fr}
.d-media{display:grid;place-items:center;padding:22px;background:#191A1C;min-width:0}
.d-media.light{background:#E4DFD3}
.d-media img{max-width:100%;max-height:62vh;object-fit:contain}
.d-info{display:flex;flex-direction:column;gap:14px;padding:26px 24px;min-width:0}
.d-kind{margin:0;font:700 11px/1.3 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.d-info h2{margin:0;font:800 28px/1.1 var(--f-sign)}
.d-info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.d-info dt{font:700 11px/1.6 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.d-info dd{margin:0;font-size:15px;line-height:1.5}
.d-note{margin:0;padding:10px 12px;border-left:3px solid var(--led);background:rgba(255,122,31,.09);font-size:13.5px;line-height:1.5}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:12px 18px;border-radius:5px;border:2px solid var(--ink);cursor:pointer;font:800 13px/1 var(--f-sign);letter-spacing:.1em;text-transform:uppercase}
.btn.primary{background:var(--ink);color:var(--enamel)}
.btn.ghost{background:transparent;color:var(--ink)}
.d-msg{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted);min-height:1.4em}
@media (max-width:640px){.d-grid{grid-template-columns:1fr}.d-media img{max-height:42vh}:root{--pole-w:26px}}
@media (prefers-reduced-motion:reduce){.led,.row.in .settle{animation:none}.swing{transform:none}.frame,.hat-art{transition:none}}
.btn.added{background:var(--street)!important;border-color:var(--street)!important;color:#fff!important}

/* Realistic NYC hardware: galvanized steel arms, banded clamps, eye nuts, granite curb with steel nosing, cast-iron base */
.arm{height:12px;top:-1px;border-radius:2px 6px 6px 2px;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 22%,rgba(0,0,0,0) 40%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.6) 100%),
    var(--pole-tex) center / 140px auto repeat,#7f878d;
  background-blend-mode:normal,luminosity,normal;box-shadow:0 5px 7px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25)}
.row.right .arm{border-radius:2px 6px 6px 2px}.row.left .arm{border-radius:6px 2px 2px 6px}
.clamp{top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:transparent;
  border:3.5px solid #4a5157;box-shadow:inset 1px 1px 0 rgba(255,255,255,.45),inset -1px -1px 0 rgba(0,0,0,.5),0 2px 3px rgba(0,0,0,.4);z-index:1}
.clamp::after{content:"";position:absolute;left:50%;top:-12px;width:9px;height:9px;margin-left:-4.5px;border-radius:2px;
  background:linear-gradient(90deg,#2a2f33,#9aa3aa 45%,#3a4045);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.collar{top:-9px;height:30px;width:calc(var(--pole-w) + 8px);border-radius:3px;
  background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(255,255,255,.28) 38%,rgba(255,255,255,.08) 52%,rgba(0,0,0,.7)),
    repeating-linear-gradient(180deg,transparent 0 4px,rgba(0,0,0,.35) 4px 5px,transparent 5px 20px,rgba(0,0,0,.35) 20px 21px),#8d959b;
  box-shadow:0 3px 5px rgba(0,0,0,.4)}
.collar::after{content:"";position:absolute;top:9px;width:10px;height:12px;border-radius:2px;background:linear-gradient(90deg,#2b3034,#a6aeb4 50%,#2b3034)}
.row.right .collar::after{right:-8px}.row.left .collar::after{left:-8px}
.hookwire{filter:drop-shadow(1.5px 2.5px 1.5px rgba(0,0,0,.45))}
.curb{height:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0,rgba(255,255,255,.08) 55%,rgba(0,0,0,0) 56%),
    linear-gradient(180deg,transparent 0 58%,#2c2b29 58%,#6a5646 61%,#3a3633 64%,rgba(0,0,0,.42) 64%,rgba(0,0,0,.28) 100%),
    var(--concrete-tex) center 30% / 520px auto repeat,#b8b4ab;
  background-blend-mode:normal,normal,luminosity,normal;box-shadow:0 10px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.base{top:-6px;width:118px;height:40px;border-radius:2px 2px 4px 4px;clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);
  background:radial-gradient(circle at 14% 78%,#101214 0 3px,rgba(200,205,210,.5) 3.5px,transparent 4.5px),
    radial-gradient(circle at 86% 78%,#101214 0 3px,rgba(200,205,210,.5) 3.5px,transparent 4.5px),
    linear-gradient(180deg,rgba(255,255,255,.12),transparent 30%,rgba(0,0,0,.35)),
    linear-gradient(90deg,#15181b,#4d555b 35%,#5f676d 48%,#23272a 80%,#121416),
    radial-gradient(ellipse at 70% 60%,rgba(120,60,30,.35),transparent 60%);
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}

/* Sidewalk signature: letters pressed into the wet concrete, like NYC sidewalk stamps. Darker cast fill, lit lower edge, shadowed upper edge. */
.stencil{margin:30px 0 4px;transform:rotate(-1.2deg);mix-blend-mode:normal;color:transparent;
  font:800 clamp(34px,9.2vw,76px)/1 var(--f-sign);letter-spacing:.14em;padding-left:.14em;
  background:linear-gradient(180deg,rgba(18,18,20,.62),rgba(30,30,32,.5)),var(--concrete-tex) center / 420px auto repeat,#5a5853;
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 -2px 0 rgba(0,0,0,.55)) drop-shadow(0 2px 0 rgba(255,255,255,.6)) drop-shadow(0 0 1px rgba(0,0,0,.35))}
.stencil small{margin-top:16px;font:700 clamp(14px,3.6vw,26px)/1 var(--f-mono);letter-spacing:.5em;padding-left:.5em}
</style>
<div class="sky" aria-hidden="true">
  <div class="ph day" id="phDay"></div><div class="ph gold" id="phGold"></div><div class="ph night" id="phNight"></div>
</div>

<main class="scene">
  <div class="pole" aria-hidden="true"></div>
  <header class="hero">
    <div class="signal">
      <img id="signalImg" alt="" width="769" height="751">
      <div class="ledbox">
        <h1 class="led" id="firstName">Bruno</h1>
        <p class="led-sub" id="lastName">Saquicela</p>
      </div>
    </div>
    <section class="plaque" aria-label="About the artist">
      <p class="eyebrow" id="tagline"></p>
      <p class="bio" id="bio"></p>
      <div class="cue"><svg viewBox="0 0 28 36" aria-hidden="true"><path d="M10 0h8v22h8L14 36 2 22h8z" fill="currentColor"/></svg><span>Scroll down the pole</span></div>
    </section>
  </header>
  <div class="rack" id="rack"></div>
</main>

<footer class="sidewalk" id="sidewalk">
  <span class="curb" aria-hidden="true"></span><span class="base" aria-hidden="true"></span>

</footer>

</dialog>

<script>
/* =====================================================================
   EDIT HERE. Everything on the page comes from this one object.
   - assets: scene photos (files in img/; swap any path or URL).
   - items: image = photo URL replaces the placeholder; price = number or null.
   ===================================================================== */
const CONFIG = {
  assets: {
    signal:   "img/signal.webp",
    /* Backgrounds ship in three sizes: big (retina desktop), mid (1x desktop), tall (portrait phones). */
    skyDay:   { big: "img/sky-day-2688.webp?v=4k",   mid: "img/sky-day-1920.webp?v=4k",   tall: "img/sky-day-m.webp?v=4k" },
    skyGold:  { big: "img/sky-gold-2688.webp?v=4k",  mid: "img/sky-gold-1920.webp?v=4k",  tall: "img/sky-gold-m.webp?v=4k" },
    skyNight: { big: "img/sky-night-2688.webp?v=4k", mid: "img/sky-night-1920.webp?v=4k", tall: "img/sky-night-m.webp?v=4k" },
    pole:     "img/pole.webp",
    concrete: { big: "img/concrete-2688.webp?v=4k",  mid: "img/concrete-1920.webp?v=4k",  tall: "img/concrete-m.webp?v=4k" }
  },
  artist: {
    first: "Bruno", last: "Saquicela",
    tagline: "Visual artist · Abstract painter · Queens, NY",
    bio: "Bruno Saquicela is a visual artist and abstract painter, born and raised in Queens, NY. He predominantly creates abstract paintings using 3-D elements from found objects and natural materials. His most recent exploration into collage work has brought forth a new body of work, and these hats, which are now being featured."
  },
  /* Pole shows every Available piece from data.js (WORKS). Edit data.js, not this. */
  sections: [
    /* The pole uses a clean flat-lay image (w.pole) when one exists; the gallery always shows the real photo (w.image). */
    { name: "Hats", unit: "for sale", kind: "hat", items: (window.WORKS || []).filter(w => w.kind === "hat" && w.status === "Available").map(w => w.pole ? Object.assign({}, w, { image: w.pole.image, w: w.pole.w, h: w.pole.h }) : w) },
    { name: "Paintings", unit: "for sale", kind: "painting", items: (window.WORKS || []).filter(w => w.kind === "art" && w.status === "Available") }
  ].filter(sec => sec.items.length)
};
/* ===================================================================== */

(() => {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const cssUrl = u => `url("${String(u).replace(/"/g, "%22")}")`;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const price = p => (typeof p === "number" ? "$" + p.toLocaleString("en-US") : "Price TBD");
  const A = CONFIG.assets;

  /* Scene assets + text */
  $("signalImg").src = A.signal;
  const portraitMQ = matchMedia("(max-aspect-ratio: 3/4)");
  const pickSize = set => typeof set === "string" ? set : (portraitMQ.matches ? set.tall : (window.devicePixelRatio >= 1.5 ? set.big : set.mid));
  function applyBackgrounds() {
    $("phDay").style.backgroundImage = cssUrl(pickSize(A.skyDay));
    $("phGold").style.backgroundImage = cssUrl(pickSize(A.skyGold));
    $("phNight").style.backgroundImage = cssUrl(pickSize(A.skyNight));
    root.style.setProperty("--concrete-tex", cssUrl(pickSize(A.concrete)));
  }
  applyBackgrounds();
  (portraitMQ.addEventListener ? portraitMQ.addEventListener("change", applyBackgrounds) : portraitMQ.addListener(applyBackgrounds));
  root.style.setProperty("--pole-tex", cssUrl(A.pole));
  $("firstName").textContent = CONFIG.artist.first;
  $("lastName").textContent = CONFIG.artist.last;
  $("tagline").textContent = CONFIG.artist.tagline;
  $("bio").textContent = CONFIG.artist.bio;
  $("stencil").innerHTML = esc(CONFIG.artist.first + " " + CONFIG.artist.last) + "<small>Queens, NY</small>";

  /* Placeholder art (only used where an item has no image) */
  const PAL = [["#1B2A41","#E4572E","#F3A712","#EFE9DC","#29335C"],["#2E2A24","#C8553D","#F28F3B","#FFD5C2","#588B8B"],
    ["#0F3D3E","#E2DCC8","#C1502E","#F1C40F","#100F0F"],["#3D2C8D","#F05454","#F5EDDC","#30475E","#E9B44C"],["#26313B","#B8C4BB","#D9653B","#F2E8CF","#6A994E"]];
  function torn(c, r, cx, cy, w, h, rot, color, shadow) {
    const step = Math.max(5, w / 40), j = 3.2, pts = [];
    for (let i = 0; i <= w; i += step) pts.push([-w/2 + i, -h/2 + (r() - .5) * j]);
    for (let i = 0; i <= h; i += step) pts.push([w/2 + (r() - .5) * j, -h/2 + i]);
    for (let i = w; i >= 0; i -= step) pts.push([-w/2 + i, h/2 + (r() - .5) * j]);
    for (let i = h; i >= 0; i -= step) pts.push([-w/2 + (r() - .5) * j, -h/2 + i]);
    c.save(); c.translate(cx, cy); c.rotate(rot); c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) c.lineTo(p[0], p[1]);
    c.closePath(); c.fillStyle = color;
    if (shadow) { c.shadowColor = "rgba(0,0,0,.28)"; c.shadowBlur = 8; c.shadowOffsetY = 3; }
    c.fill(); c.restore();
  }
  function grain(c, r, W, H, n, a) { for (let i = 0; i < n; i++) { c.fillStyle = r() < .5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`; c.fillRect(r() * W, r() * H, 1.4, 1.4); } }
  function drawPainting(cv, seed, ratio) {
    const W = 600, H = Math.round(600 / ratio); cv.width = W; cv.height = H;
    const c = cv.getContext("2d"), r = rng(seed * 97 + 13), P = PAL[seed % PAL.length];
    c.fillStyle = P[0]; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) torn(c, r, r() * W, r() * H, W * (.4 + r() * .5), H * (.25 + r() * .35), (r() - .5) * .5, P[1 + (i % 4)], false);
    c.lineCap = "round";
    for (let i = 0; i < 4; i++) { c.strokeStyle = P[1 + Math.floor(r() * 4)]; c.globalAlpha = .85; c.lineWidth = 14 + r() * 36;
      c.beginPath(); c.moveTo(r() * W, r() * H); c.quadraticCurveTo(r() * W, r() * H, r() * W, r() * H); c.stroke(); }
    c.globalAlpha = 1;
    for (let i = 0; i < 6; i++) torn(c, r, r() * W, r() * H, 50 + r() * 150, 30 + r() * 110, (r() - .5) * .9, P[1 + Math.floor(r() * 4)], true);
    grain(c, r, W, H, 5200, .07);
  }
  function drawHat(cv, seed) {
    const W = 400, H = 320; cv.width = W; cv.height = H;
    const c = cv.getContext("2d"), r = rng(seed * 131 + 7), P = PAL[(seed + 2) % PAL.length];
    const crown = () => { c.beginPath(); c.moveTo(72, 222); c.bezierCurveTo(72, 88, 328, 88, 328, 222); c.closePath(); };
    c.save(); crown(); c.clip(); c.fillStyle = P[0]; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 9; i++) torn(c, r, 70 + r() * 260, 100 + r() * 130, 50 + r() * 110, 30 + r() * 70, (r() - .5), P[1 + Math.floor(r() * 4)], true);
    grain(c, r, W, H, 1800, .08); c.restore();
    crown(); c.strokeStyle = "rgba(0,0,0,.55)"; c.lineWidth = 3; c.stroke();
    c.beginPath(); c.moveTo(58, 216); c.quadraticCurveTo(200, 310, 342, 216); c.quadraticCurveTo(200, 250, 58, 216); c.closePath();
    c.fillStyle = P[4]; c.fill(); c.stroke();
    c.beginPath(); c.arc(200, 121, 8, 0, Math.PI * 2); c.fillStyle = P[1]; c.fill(); c.stroke();
  }

  /* Rack */
  const rack = $("rack"), registry = new Map();
  let side = 0, seed = 1;
  CONFIG.sections.forEach(sec => {
    const blade = document.createElement("div");
    blade.className = "blade-row";
    blade.innerHTML = `<div class="blade"><h2>${esc(sec.name)}</h2><p>${sec.items.length} ${esc(sec.unit)}</p></div>`;
    rack.appendChild(blade);
    sec.items.forEach(it => {
      const isHat = sec.kind === "hat", s = seed++, dir = side++ % 2 ? "left" : "right";
      const row = document.createElement("div");
      row.className = "row " + dir; row.id = it.id;
      const k = (0.65 + rng(s * 7)() * 0.6).toFixed(2);
      const cr = it.crop || (it.w ? { l: 0, t: 0, w: 100, h: 100, nw: it.w, nh: it.h } : { l: 0, t: 0, w: 100, h: 100, nw: 1, nh: 1 });
      const ar = it.image ? (cr.w * cr.nw) / (cr.h * cr.nh) : (isHat ? 1.25 : it.ratio);
      const scale = isHat ? 1 : (ar > 1 ? 1.12 : ar < .75 ? .85 : 1);
      const wire = isHat
        ? `<svg class="wire hookwire" viewBox="0 0 100 46" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <path d="M43 21v25" stroke="#2c3135" stroke-width="1.9"/><path d="M43.5 21v25" stroke="rgba(220,226,230,.55)" stroke-width=".6"/>
            <path d="M50 0v14a7 7 0 1 1-7 7" fill="none" stroke="#3b4247" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M49.2 1v13a7.8 7.8 0 1 1-7.4 7.6" fill="none" stroke="rgba(236,240,243,.75)" stroke-width="1" stroke-linecap="round"/>
            <path d="M50.9 2v12a6.2 6.2 0 1 1-6.3 6.6" fill="none" stroke="rgba(10,12,14,.55)" stroke-width=".8" stroke-linecap="round"/></svg>`
        : `<svg class="wire" viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true"><path d="M50 2 L6 46 M50 2 L94 46" fill="none" stroke="#1F2427" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="50" cy="3" r="3" fill="#1F2427"/></svg>`;
      const ratioCss = isHat ? "400 / 320" : `600 / ${Math.round(600 / (it.ratio || 1))}`;
      const art = it.image
        ? `<div class="cut" style="aspect-ratio:${ar.toFixed(4)}"><img src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy" style="width:${(10000 / cr.w).toFixed(2)}%;left:${(-cr.l / cr.w * 100).toFixed(2)}%;top:${(-cr.t / cr.h * 100).toFixed(2)}%"></div>`
        : `<canvas role="img" aria-label="Placeholder artwork for ${esc(it.title)}"></canvas>`;
      const body = it.image ? art : isHat ? `<div class="hat-art">${art}</div>` : `<div class="frame">${art}</div>`;
      row.innerHTML = `<span class="arm" aria-hidden="true"></span><span class="clamp" aria-hidden="true"></span><span class="collar" aria-hidden="true"></span>
        <div class="slot"><div class="swing" style="--k:${k}"><div class="settle">
          <button class="piece ${isHat ? "hat" : "painting"}" type="button" data-id="${esc(it.id)}" style="--ratio:${ratioCss};--scale:${scale};--frame:${esc(it.frame || "#1B1B1B")}"
            aria-label="${esc(it.title)}, ${esc(price(it.price))}. Open details.">${wire}${body}
            <span class="tag"><span>${esc(it.id)} · ${esc(price(it.price))}</span>${it.image ? "" : '<span class="ph-label">Placeholder</span>'}</span>
          </button></div></div></div>`;
      rack.appendChild(row);
      const cv = row.querySelector("canvas");
      if (cv) isHat ? drawHat(cv, s) : drawPainting(cv, s, it.ratio);
      registry.set(it.id, { it, kind: isHat ? "Hat" : "Painting", cv, img: row.querySelector("img") });
      /* Hook fit: find the first solid pixel of the hat directly under the wire and lift the hat so it touches the hook. */
      const hatImg = isHat && row.querySelector(".cut img");
      if (hatImg) {
        const fit = () => {
          try {
            const W = hatImg.naturalWidth, H = hatImg.naturalHeight, pc = row.querySelector(".piece");
            if (!W || !H || !pc.clientWidth) return;
            const col = Math.round(W * Math.max(0, (pc.clientWidth / 2 - 7) / pc.clientWidth));
            const c = document.createElement("canvas"); c.width = 9; c.height = H;
            const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(hatImg, col - 4, 0, 9, H, 0, 0, 9, H);
            const d = x.getImageData(0, 0, 9, H).data; let top = 0;
            outer: for (let y = 0; y < H; y++) for (let i = 0; i < 9; i++) if (d[(y * 9 + i) * 4 + 3] > 140) { top = y; break outer; }
            const f = Math.min(top / H, 0.3);
            row.querySelector(".cut").style.marginTop = `${(-f / ar * 100).toFixed(2)}%`;
          } catch (e) { /* canvas unavailable: leave hat as is */ }
        };
        hatImg.complete ? fit() : hatImg.addEventListener("load", fit, { once: true });
      }
    });
  });
  /* Sign to the gallery: everything not for sale lives on the wall */
  const g = document.createElement("div");
  g.className = "blade-row";
  g.innerHTML = `<a class="blade gal-sign" href="gallery.html"><h2>Gallery wall &rarr;</h2><p>Paintings, collage &amp; past work</p></a>`;
  rack.appendChild(g);
  if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) setTimeout(() => t.scrollIntoView({ block: "center" }), 60); }

  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .3 });
    rack.querySelectorAll(".row").forEach(r => io.observe(r));
  }

  /* Detail dialog */
  const dlg = $("detail");
  rack.addEventListener("click", e => {
    const b = e.target.closest(".piece"); if (!b) return;
    const rec = registry.get(b.dataset.id); if (!rec) return;
    const { it, kind, cv, img } = rec;
    $("dImg").src = img ? img.src : cv.toDataURL("image/png"); $("dImg").alt = it.title;
    $("dMedia").classList.toggle("light", kind === "Hat");
    $("dKind").textContent = kind + " · " + it.id; $("dTitle").textContent = it.title;
    $("dMedium").textContent = it.medium || "TBD"; $("dMediumL").hidden = $("dMedium").hidden = true; $("dSize").textContent = it.size || ""; $("dSizeL").hidden = $("dSize").hidden = !it.size; $("dPrice").textContent = price(it.price);
    const note = $("dNote"); note.hidden = !!it.image; note.textContent = "Placeholder artwork. Replace it by adding a photo URL to this item in CONFIG.";
    $("dMsg").textContent = "";
    current = it.id; $("dView").href = "item.html?id=" + encodeURIComponent(it.id); syncCart();
    typeof dlg.showModal === "function" ? dlg.showModal() : dlg.setAttribute("open", "");
  });
  let current = null;
  function syncCart() {
    const b = $("dCart"), S = window.Shop; if (!S || !current) return;
    const inCart = S.has(current);
    b.textContent = inCart ? "In cart · View cart" : "Add to cart"; b.classList.toggle("added", inCart);
  }
  if (window.Shop) window.Shop.onChange(syncCart);
  const closeDlg = () => (typeof dlg.close === "function" ? dlg.close() : dlg.removeAttribute("open"));
  $("dClose").addEventListener("click", closeDlg);
  dlg.addEventListener("click", e => { if (e.target === dlg) closeDlg(); });
  $("dCart").addEventListener("click", () => {
    const S = window.Shop; if (!S || !current) return;
    if (S.has(current)) { closeDlg(); S.open(); } else { S.add(current); $("dMsg").textContent = "Added to your cart."; }
  });
  $("upBtn").addEventListener("click", () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));

  /* Scroll: day > golden hour > night, slow parallax, sway spring */
  const day = $("phDay"), gold = $("phGold"), night = $("phNight");
  let maxScroll = 1;
  const measure = () => { maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight); };
  function scene(y) {
    const p = clamp01(y / maxScroll);
    gold.style.opacity = smooth(.18, .5, p).toFixed(3);
    night.style.opacity = smooth(.55, .88, p).toFixed(3);
    const ty = reduce ? 0 : -(p * 14).toFixed(2);
    for (const el of [day, gold, night]) el.style.transform = `translate3d(0,${ty}vh,0)`;
  }
  let lastY = scrollY, angle = 0, vel = 0, running = false;
  function frame() {
    const y = scrollY, v = y - lastY; lastY = y; scene(y);
    if (!reduce) { const target = Math.max(-9, Math.min(9, v * .35)); vel += (target - angle) * .07; vel *= .86; angle += vel;
      root.style.setProperty("--sway", angle.toFixed(2) + "deg"); }
    if (Math.abs(v) > .1 || Math.abs(vel) > .01 || Math.abs(angle) > .02) requestAnimationFrame(frame);
    else { running = false; angle = vel = 0; root.style.setProperty("--sway", "0deg"); }
  }
  addEventListener("scroll", () => { if (!running) { running = true; requestAnimationFrame(frame); } }, { passive: true });
  addEventListener("resize", measure);
  if ("ResizeObserver" in window) new ResizeObserver(measure).observe(document.body);
  measure(); scene(scrollY);
})();
</script>
